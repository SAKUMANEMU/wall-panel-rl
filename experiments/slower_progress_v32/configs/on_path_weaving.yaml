# Refine the successful vertical corridor without replacing its route geometry.
placement_mode: refine_existing
contact_overlap_m: 0.008
maximum_anchor_translation_m: 0.12
# O1 crosses its physical collision witness at the old execution's timestamp.
align_guide_crossing_slots: [0]
# Optional resampling settings, in GUI slot order (--layout-seed enables these).
route_fractions: [0.38, 0.58, 0.18, 0.76]
fraction_jitter: 0.065
attempts_per_obstacle: 100
swept_z_bounds_m: [0.02, 1.65]
motion_profile:
  expert_probability: 0.5
  motion:
    amplitude_m: 0.18
    max_speed_m_s: 0.12
    frequency_fraction: [0.65, 1.0]
    seed_offset: 9000000
  placement_attempts: 100
  anchor_restarts: 5
  height_stagger:
    offset_m: [0.14, 0.24]
    min_span_m: 0.40
    min_adjacent_delta_m: 0.20
